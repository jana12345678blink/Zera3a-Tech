<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>إنشاء حساب | Zera3a-Tech</title>

  <!-- Google Font & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ========== RESET & BASE ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Cairo", sans-serif; }
    
    html, body { width: 100%; overflow-x: hidden; }

    :root {
      /* Light Mode Colors */
      --primary: #0f4c5c;
      --secondary: #e67e5f;
      --bg: #faf9f6;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #0f172a;
      --muted: #6b7280;
      --nav-bg: rgba(255, 255, 255, 0.9);
      --nav-border: rgba(0,0,0,0.05);
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    body.dark {
      /* Dark Mode Colors */
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #0f4c5c;
      --secondary: #fb923c;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --nav-bg: rgba(30, 41, 59, 0.9);
      --nav-border: #475569;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* ========== NAVBAR (Floating Pill) ========== */
    .top-nav-bar {
      position: fixed;
      top: 15px;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 12px;
      border-radius: 40px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid var(--nav-border);
      transition: all 0.3s;
      max-width: calc(100% - 40px);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .top-nav-bar::-webkit-scrollbar { display: none; }

    /* RTL/LTR Positioning */
    html[dir="rtl"] .top-nav-bar { right: 20px; left: auto; }
    html[dir="ltr"] .top-nav-bar { left: 20px; right: auto; }

    /* Navbar Buttons */
    .nav-btn, .control-pill {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    
    .nav-btn:hover, .control-pill:hover {
      background: rgba(0,0,0,0.05);
      transform: translateY(-1px);
    }
    body.dark .nav-btn:hover, body.dark .control-pill:hover {
      background: rgba(255,255,255,0.1);
    }

    .nav-divider {
      width: 1px;
      height: 20px;
      background-color: var(--border);
      margin: 0 4px;
    }

    /* ========== LAYOUT ========== */
    .page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      width: 100%;
    }

    /* LEFT (FORM) */
    .left {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 100px 20px 40px 20px; /* Top padding for nav */
    }

    .card {
      background: var(--card);
      width: 100%;
      max-width: 500px;
      padding: 40px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .title { font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 25px; }

    /* ROLES */
    .roles { display: flex; gap: 10px; margin-bottom: 25px; background: var(--bg); padding: 5px; border-radius: 16px; }
    
    .role {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: 700;
      color: var(--muted);
      transition: all 0.3s;
      font-size: 14px;
    }
    
    .role.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 10px rgba(15, 76, 92, 0.2);
    }

    /* FORM */
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    
    .group { display: flex; flex-direction: column; }
    .group.full { grid-column: 1 / 3; }

    label { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 6px; }

    input {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      width: 100%;
      transition: border-color 0.3s;
    }
    input:focus { outline: none; border-color: var(--primary); }

    button.submit-btn {
      grid-column: 1 / 3;
      margin-top: 10px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: var(--secondary);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    button.submit-btn:hover { opacity: 0.9; transform: scale(1.01); }

    .signin { margin-top: 20px; text-align: center; font-size: 14px; color: var(--muted); }
    .signin a { color: var(--primary); font-weight: 800; text-decoration: none; }

    /* RIGHT PANEL */
    .right {
      background: var(--primary);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
    }
    
    /* Decorative Circle */
    .right::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      top: -50px;
      right: -50px;
    }

    .brand { font-size: 24px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .welcome { font-size: 32px; font-weight: 800; line-height: 1.4; margin-bottom: 30px; }
    .features li { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; font-size: 16px; opacity: 0.9; }
    .features i { color: var(--secondary); }

    /* ========== TOAST NOTIFICATION (No Alerts) ========== */
    .toast-container {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      pointer-events: none;
    }
    .toast {
      background: var(--card);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success i { color: #10b981; }
    .toast.error i { color: #ef4444; }

    /* ========== RESPONSIVE ========== */
    @media(max-width: 900px) {
      .page { grid-template-columns: 1fr; }
      .right { display: none; }
      .left { padding-top: 90px; justify-content: flex-start; }
      form { grid-template-columns: 1fr; }
      .group.full { grid-column: auto; }
    }
    
    @media(max-width: 480px) {
      .top-nav-bar { padding: 6px 10px; gap: 4px; }
      .nav-btn span, .control-pill span { display: none; } /* Hide text on very small screens, show icons only */
      .nav-btn, .control-pill { padding: 8px; }
      .card { padding: 25px 20px; }
      .title { font-size: 24px; }
    }
  </style>
</head>

<body>

  <!-- NAV BAR: Back | Dark Mode | Lang | Divider | Home -->
  <div class="top-nav-bar">
    <!-- زر العودة -->
    <button class="nav-btn" onclick="goBack()" id="btnBack">
      <i class="fas fa-arrow-right" id="iconBack"></i> 
      <span data-i18n="back-btn">العودة</span>
    </button>
    
    <!-- زر الوضع الليلي -->
    <button class="control-pill" onclick="toggleTheme()" title="Theme">
      <i class="fas fa-moon" id="themeIcon"></i> 
      <span data-i18n="dark-mode">ليلي</span>
    </button>
    
    <!-- زر الترجمة -->
    <button class="control-pill" onclick="toggleLanguage()" title="Language">
      <i class="fas fa-globe"></i> 
      <span id="langText">English</span>
    </button>

    <div class="nav-divider"></div>
    
    <!-- زر الرئيسية -->
    <button class="nav-btn" onclick="goHome()">
      <i class="fas fa-home"></i>
      <span data-i18n="home-btn">الرئيسية</span>
    </button>
  </div>

  <div class="page">
    <!-- RIGHT PANEL (Hidden on Mobile) -->
    <div class="right">
      <div class="brand"><i class="fas fa-leaf"></i> ZERA3A TECH</div>
      <div class="welcome" data-i18n="hero-title">منصة المستقبل للزراعة الذكية</div>
      <ul class="features">
        <li data-i18n="feat-1"><i class="fas fa-check-circle"></i> إدارة المحاصيل بذكاء</li>
        <li data-i18n="feat-2"><i class="fas fa-check-circle"></i> ربط مباشر بالسوق</li>
        <li data-i18n="feat-3"><i class="fas fa-shield-alt"></i> أمان البيانات وشفافيتها</li>
      </ul>
    </div>
   
    <!-- LEFT PANEL (FORM) -->
    <div class="left">
      <div class="card">
        <h2 class="title" data-i18n="title">إنشاء حساب جديد</h2>
        <p class="subtitle" data-i18n="sub">انضم إلينا وابدأ رحلتك الزراعية</p>

        <!-- ROLES -->
        <div class="roles">
          <div class="role active" onclick="selectRole('farmer', this)" data-i18n="role-farmer">فلاح</div>
          <div class="role" onclick="selectRole('investor', this)" data-i18n="role-investor">مستثمر</div> 
          <div class="role" onclick="selectRole('worker', this)" data-i18n="role-worker">عامل</div> 
        </div>

        <form id="signupForm">
          <input type="hidden" id="roleSelect" value="farmer">

          <div class="group">
            <label data-i18n="lbl-name">الاسم الكامل</label>
            <input type="text" id="fullName" required placeholder="Ex: Ahmed Ali">
          </div>

          <div class="group">
            <label data-i18n="lbl-phone">رقم الهاتف</label>
            <input type="tel" id="phone" placeholder="01xxxxxxxx">
          </div>

          <div class="group full">
            <label data-i18n="lbl-email">البريد الإلكتروني</label>
            <input type="email" id="email" required placeholder="name@example.com">
          </div>

          <div class="group">
            <label data-i18n="lbl-pass">كلمة المرور</label>
            <input type="password" id="password" required>
          </div>

          <div class="group">
            <label data-i18n="lbl-confirm">تأكيد كلمة المرور</label>
            <input type="password" id="confirmPassword" required>
          </div>

          <button type="submit" class="submit-btn" data-i18n="btn-submit">إنشاء الحساب</button>
        </form>

        <div class="signin">
          <span data-i18n="txt-have-account">لديك حساب بالفعل؟</span> 
          <a href="signin.html" data-i18n="link-signin">تسجيل الدخول</a>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container">
    <div id="toast" class="toast">
      <i class="fas fa-info-circle"></i>
      <span id="toastMsg">Message</span>
    </div>
  </div>

<!-- ========== FIREBASE MODULE ========== -->
<script type="module">
/* ================= FIREBASE CONFIGURATION ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  updateProfile
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCg8ej80A4VnHFK2iuXx4nhEt9Wtmf4ulU",
  authDomain: "smart-farm-8d3f5.firebaseapp.com",
  projectId: "smart-farm-8d3f5",
  storageBucket: "smart-farm-8d3f5.appspot.com",
  messagingSenderId: "317371842198",
  appId: "1:317371842198:web:4765ea8c0036ae64b10cb7"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= FORM HANDLING ================= */
// Role Selection Logic is now global so it works with inline onclick
window.selectRole = function(role, el) {
  document.querySelectorAll(".role").forEach(r => r.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("roleSelect").value = role;
};

document.getElementById("signupForm").addEventListener("submit", async e => {
  e.preventDefault();
  
  const submitBtn = document.querySelector('.submit-btn');
  const originalBtnText = submitBtn.innerText;
  
  // Loading State
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري المعالجة...';

  const role = document.getElementById("roleSelect").value;
  const fullName = document.getElementById("fullName").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const lang = window.currentLang;

  // Client-side Validation
  if (password !== confirmPassword) {
    showToast(getTrans("err-pass"), "error");
    submitBtn.disabled = false;
    submitBtn.innerText = originalBtnText;
    return;
  }

  if (password.length < 6) {
    showToast(getTrans("err-short-pass"), "error");
    submitBtn.disabled = false;
    submitBtn.innerText = originalBtnText;
    return;
  }

  try {
    // 1. Create Auth User
    const cred = await createUserWithEmailAndPassword(auth, email, password);

    // 2. Update Profile
    await updateProfile(cred.user, { displayName: fullName });

    // 3. Save to Firestore
    await setDoc(doc(db, "users", cred.user.uid), {
      fullName,
      email,
      phone: document.getElementById("phone").value,
      role,
      createdAt: serverTimestamp(),
      isActive: true
    });

    showToast(`${getTrans("welcome")} ${fullName} 👋`, "success");

    // 4. Redirect based on role
    setTimeout(() => {
      let redirectUrl = "index.html";
      if (role === "farmer") redirectUrl = "../farmer-ar.html";
      else if (role === "investor") redirectUrl = "../investor.html";
      else if (role === "worker") redirectUrl = "../worker.html";
      
      window.location.href = redirectUrl;
    }, 1500);

  } catch (error) {
    console.error(error);
    showToast(error.message, "error");
    submitBtn.disabled = false;
    submitBtn.innerText = originalBtnText;
  }
});

// Helper to access translations from module
function getTrans(key) {
  return window.translations[window.currentLang][key] || key;
}
</script>

<!-- ========== UI & TRANSLATION LOGIC ========== -->
<script>
  // --- Global State ---
  window.currentLang = "ar";
  window.isDarkMode = false;

  // --- Translations ---
  window.translations = {
    ar: {
      "back-btn": "العودة",
      "home-btn": "الرئيسية",
      "dark-mode": "ليلي",
      "light-mode": "نهاري",
      "title": "إنشاء حساب جديد",
      "sub": "انضم إلينا وابدأ رحلتك الزراعية",
      "role-farmer": "فلاح",
      "role-investor": "مستثمر",
      "role-worker": "عامل",
      "lbl-name": "الاسم الكامل",
      "lbl-phone": "رقم الهاتف",
      "lbl-email": "البريد الإلكتروني",
      "lbl-pass": "كلمة المرور",
      "lbl-confirm": "تأكيد كلمة المرور",
      "btn-submit": "إنشاء الحساب",
      "txt-have-account": "لديك حساب بالفعل؟",
      "link-signin": "تسجيل الدخول",
      "hero-title": "منصة المستقبل للزراعة الذكية",
      "feat-1": "إدارة المحاصيل بذكاء",
      "feat-2": "ربط مباشر بالسوق",
      "feat-3": "أمان البيانات وشفافيتها",
      "err-pass": "كلمات المرور غير متطابقة",
      "err-short-pass": "كلمة المرور قصيرة جداً",
      "welcome": "أهلاً بك"
    },
    en: {
      "back-btn": "Back",
      "home-btn": "Home",
      "dark-mode": "Dark",
      "light-mode": "Light",
      "title": "Create Account",
      "sub": "Join us and start your journey",
      "role-farmer": "Farmer",
      "role-investor": "Investor",
      "role-worker": "Worker",
      "lbl-name": "Full Name",
      "lbl-phone": "Phone Number",
      "lbl-email": "Email Address",
      "lbl-pass": "Password",
      "lbl-confirm": "Confirm Password",
      "btn-submit": "Sign Up",
      "txt-have-account": "Already have an account?",
      "link-signin": "Sign In",
      "hero-title": "Future Smart Farming Platform",
      "feat-1": "Smart Crop Management",
      "feat-2": "Direct Market Access",
      "feat-3": "Data Security & Transparency",
      "err-pass": "Passwords do not match",
      "err-short-pass": "Password is too short",
      "welcome": "Welcome"
    }
  };

  // --- Functions ---

  function toggleTheme() {
    window.isDarkMode = !window.isDarkMode;
    document.body.classList.toggle("dark");
    
    // Update Icon and Text
    const themeIcon = document.getElementById("themeIcon");
    const themeText = document.querySelector('[data-i18n="dark-mode"]');
    
    if (window.isDarkMode) {
      themeIcon.className = "fas fa-sun";
      themeText.innerText = window.translations[window.currentLang]["light-mode"];
    } else {
      themeIcon.className = "fas fa-moon";
      themeText.innerText = window.translations[window.currentLang]["dark-mode"];
    }
  }

  function toggleLanguage() {
    window.currentLang = window.currentLang === "ar" ? "en" : "ar";
    const isAr = window.currentLang === "ar";
    
    // 1. Update HTML Direction
    document.documentElement.dir = isAr ? "rtl" : "ltr";

    // 2. Update Text Content
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.dataset.i18n;
      if (window.translations[window.currentLang][key]) {
        el.innerText = window.translations[window.currentLang][key];
      }
    });

    // 3. Update Language Button Text
    document.getElementById("langText").innerText = isAr ? "English" : "العربية";

    // 4. Update Back Arrow Direction (Crucial for UX)
    const backIcon = document.getElementById("iconBack");
    backIcon.className = isAr ? "fas fa-arrow-right" : "fas fa-arrow-left";

    // 5. Update Theme Text based on current state
    const themeText = document.querySelector('[data-i18n="dark-mode"]'); // Selecting by key
    if(themeText) {
        const key = window.isDarkMode ? "light-mode" : "dark-mode";
        themeText.innerText = window.translations[window.currentLang][key];
    }
  }

  // --- Custom Toast Notification (No Alerts) ---
  function showToast(message, type = "success") {
    const toast = document.getElementById("toast");
    const msgSpan = document.getElementById("toastMsg");
    const icon = toast.querySelector("i");

    msgSpan.innerText = message;
    
    // Reset classes
    toast.className = "toast"; 
    icon.className = type === "success" ? "fas fa-check-circle" : "fas fa-exclamation-circle";
    
    // Add type class
    toast.classList.add(type);

    // Animate In
    setTimeout(() => toast.classList.add("show"), 10);

    // Animate Out
    setTimeout(() => {
      toast.classList.remove("show");
    }, 3000);
  }

  // --- Navigation ---
  function goBack() {
    history.back();
  }

  function goHome() {
    window.location.href = "index.html";
  }
</script>
</body>
</html>
